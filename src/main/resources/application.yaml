spring:
  application:
    name: ${application.name}
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations:
      - db/migration
      - db/seed
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUDNAME:}
  api-key: ${CLOUDINARY_APIKEY:}
  api-secret: ${CLOUDINARY_APISECRET:}
application:
  name: "zamazor"
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  security:
    jwt:
      refresh:
        secret: ${REFRESH_TOKEN_SECRET_KEY:}
        expiration: 7d
      access:
        secret: ${ACCESS_TOKEN_SECRET_KEY:}
        expiration: 15m
      issuer: auth-service
  stripe:
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  shop:
    order-policy:
      cancel-window: PT48H
      refund-window: P30D
      payment-hold: PT30M
  mail:
    personal-name: "Zamazor Support"
    from-address: ${SMTP_USER:}
  support-email: ${SUPPORT_EMAIL:}
  support-phone: ${SUPPORT_PHONE:}
logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: Error