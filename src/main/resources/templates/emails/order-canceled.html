<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<title>Order Cancelled</title></head>
<body style="background-color: #f3f4f6; margin: 0; padding: 0; font-family: -apple-system, sans-serif; color: #1f2937;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="padding: 40px 16px;">
	<tr>
		<td align="center">
			<table width="100%" max-width="570" cellpadding="0" cellspacing="0" role="presentation"
			       style="max-width: 570px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 6px solid #ef4444;">
				<tr>
					<td style="padding: 40px 32px;">
						<h1 th:text="${appName}" style="font-size: 18px; font-weight: 700; margin: 0 0 32px 0;">
							Market</h1>
						<h2 style="font-size: 22px; font-weight: 700; color: #111827; margin: 0 0 16px 0;">Order
							Cancelled</h2>
						<p style="font-size: 16px; line-height: 1.6; color: #4b5563; margin: 0 0 24px 0;">
							Your order <strong th:text="'#' + ${orderId}">#ID</strong> has been successfully cancelled.
							If you were already billed for this request, a refund workflow has been opened
							automatically.
						</p>
						<hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;"/>
						<p style="font-size: 12px; color: #9ca3af; text-align: center;">&copy; <span th:text="${year}">2026</span>
							<span th:text="${appName}">Market</span>.</p>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
